[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-pdf-tool"
version = "0.1.1"
description = "Fail-closed inspect, fill and render validation of original PDF forms"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24,<2", "Pillow>=10,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "reportlab>=4,<5"]

[project.scripts]
shared-pdf = "shared_pdf_tool.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
